person_detector:
  ros__parameters:
    image_topic: /front_camera/image_raw
    scan_topic: /scan
    output_frame: base_footprint
    horizontal_fov: 1.3962634

    # Identities come from clothing colours in the rendered camera image.
    # No Gazebo ground-truth pose or model name is passed to this detector.
    identity_names: [person_alpha, person_beta]
    identity_hsv_lower: [
      120, 70, 45,   # purple person_alpha
      95, 100, 45    # blue person_beta
    ]
    identity_hsv_upper: [
      170, 255, 255,
      119, 255, 255
    ]
    identity_marker_rgb: [
      0.72, 0.10, 0.96,
      0.05, 0.35, 1.00
    ]
    selected_identity: person_alpha
    minimum_blob_area: 120.0
    minimum_blob_height: 12
    minimum_blob_aspect_ratio: 0.65
    morphology_kernel: 5

    scan_timeout: 0.75
    detection_timeout: 1.0
    camera_timeout: 2.0
    # Camera and LiDAR are mounted at different offsets. Keep enough angular
    # margin for parallax when a nearby person reaches the camera edge.
    scan_window_min: 0.10
    range_percentile: 25.0
    minimum_range_samples: 2
    # Keep LiDAR returns from the visual person together while rejecting a
    # wall or crate that happens to appear behind the same camera region.
    range_cluster_tolerance: 0.25
    maximum_range_jump: 0.45
    maximum_range_rate: 1.0
    # Reject the rover's own camera mast / chassis returns near 0.18 m.
    minimum_tracking_range: 0.30
    # Human following is a nearby companion behavior. Reject arena walls
    # before they can become a false person range after a brief occlusion.
    maximum_tracking_range: 2.0
    filter_alpha: 0.35
    # Keep the annotated image opt-in; copying it every frame is expensive in
    # WSL and RViz already shows lightweight identity markers by default.
    debug_image_enabled: false
